[project]
name = "openppx"
version = "0.5.4"
description = "A lightweight skills-first agent built with Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk[db]>=2.1.0",
    "mcp>=1.24,<2",
    "greenlet>=3.1.1",
    "loguru>=0.7.3",
    "litellm>=1.75.5,<1.80.17",
    "openai>=1.100.2",
    "httpx>=0.27.0",
    "oauth-cli-kit>=0.1.1",
    "pydantic>=2.10,<3",
    "filelock>=3.16,<4",
    "keyring>=25,<26",
    "Pillow>=11,<13",
    "pypdf>=5.9,<7",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.1.0",
]

[project.scripts]
ppx = "openppx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openppx"]

[tool.hatch.build]
include = [
    "docker/**",
    "openppx/**/*.py",
    "openppx/extensions/data/**",
    "openppx/skills/**",
]
